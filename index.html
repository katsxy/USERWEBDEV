<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Super Admin Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
    font-family: Arial, sans-serif;
    background: #fff;
    margin: 0;
    padding: 20px;
}

h1 {
    text-align: center;
    margin-bottom: 30px;
}

/* TOP CARDS */
.cards {
    display: flex;
    gap: 20px;
    margin-bottom: 20px;
}

.card {
    flex: 1;
    border: 2px solid #000;
    padding: 15px;
    text-align: center;
}

/* GRID */
.grid {
    display: grid;
    grid-template-columns: 2fr 1.3fr; /* slightly bigger map */
    gap: 20px;
}

/* BOX */
.box {
    border: 2px solid #000;
    padding: 15px;
}

/* PIE */
.pie-container {
    display: flex;
    justify-content: space-around;
    margin-top: 20px;
}

.pie-item {
    text-align: center;
}

.pie-item canvas {
    width: 120px !important;
    height: 120px !important;
}

/* LOWER GRID */
.row {
    display: grid;
    grid-template-columns: 1fr 2fr;
    gap: 20px;
    margin-top: 20px;
}

/* CHART SIZE */
canvas {
    width: 100% !important;
    height: 260px !important;
}
</style>
</head>

<body>

<h1>Dashboard</h1>

<!-- TOP CARDS -->
<div class="cards">
    <div class="card"><h2>123</h2><p>Total Orders</p></div>
    <div class="card"><h2>67</h2><p>Total Delivered</p></div>
    <div class="card"><h2>26</h2><p>Total Cancelled</p></div>
    <div class="card"><h2>₱1K</h2><p>Total Revenue</p></div>
</div>

<!-- PIE + CUSTOMER MAP -->
<div class="grid">

    <!-- PIE -->
    <div class="box">
        <h2>Pie Chart</h2>

        <div class="pie-container">
            <div class="pie-item">
                <canvas id="pie1"></canvas>
                <p>Total Order</p>
            </div>

            <div class="pie-item">
                <canvas id="pie2"></canvas>
                <p>Customer Growth</p>
            </div>

            <div class="pie-item">
                <canvas id="pie3"></canvas>
                <p>Total Revenue</p>
            </div>
        </div>
    </div>

    <!-- CUSTOMER MAP -->
    <div class="box">
        <h2>Customer Map</h2>
        <canvas id="barChart"></canvas>
    </div>

</div>

<!-- LOWER SECTION -->
<div class="row">

    <!-- POPULAR PRODUCTS -->
    <div class="box">
        <h2>Popular Products</h2>
        <canvas id="productChart"></canvas>
    </div>

    <!-- LINE CHART -->
    <div class="box">
        <h2>Total Revenue</h2>
        <canvas id="lineChart"></canvas>
    </div>

</div>

<script>
// PIE 1
new Chart(document.getElementById("pie1"), {
    type: "doughnut",
    data: {
        datasets: [{
            data: [81, 19],
            backgroundColor: ["#ef4444", "#eee"],
            borderWidth: 0
        }]
    },
    options: {
        cutout: "70%",
        plugins: { legend: { display: false } }
    }
});

// PIE 2
new Chart(document.getElementById("pie2"), {
    type: "doughnut",
    data: {
        datasets: [{
            data: [22, 78],
            backgroundColor: ["#10b981", "#eee"],
            borderWidth: 0
        }]
    },
    options: {
        cutout: "70%",
        plugins: { legend: { display: false } }
    }
});

// PIE 3
new Chart(document.getElementById("pie3"), {
    type: "doughnut",
    data: {
        datasets: [{
            data: [62, 38],
            backgroundColor: ["#3b82f6", "#eee"],
            borderWidth: 0
        }]
    },
    options: {
        cutout: "70%",
        plugins: { legend: { display: false } }
    }
});

// CUSTOMER MAP (slightly bigger + cleaner)
new Chart(document.getElementById("barChart"), {
    type: "bar",
    data: {
        labels: ["Manila", "Valenzuela", "Bulacan", "Cebu"],
        datasets: [{
            data: [60, 45, 80, 30],
            backgroundColor: ["#3b82f6", "#8b5cf6", "#f59e0b", "#facc15"],
            borderRadius: 8
        }]
    },
    options: {
        plugins: { legend: { display: false } },
        scales: {
            y: { beginAtZero: true }
        }
    }
});

// POPULAR PRODUCTS
new Chart(document.getElementById("productChart"), {
    type: "pie",
    data: {
        labels: ["Sales", "Finance", "Marketing", "HR"],
        datasets: [{
            data: [55, 25, 15, 5],
            backgroundColor: ["blue", "purple", "orange", "yellow"]
        }]
    }
});

// LINE
new Chart(document.getElementById("lineChart"), {
    type: "line",
    data: {
        labels: ["2021","2022","2023","2024","2025"],
        datasets: [
            { label: "Mobile", data: [12,14,15,18,24], borderColor: "blue" },
            { label: "Desktop", data: [10,12,16,17,20], borderColor: "purple" },
            { label: "Tablet", data: [8,9,13,15,16], borderColor: "orange" }
        ]
    }
});
</script>

</body>
</html>
