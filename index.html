<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Super Admin Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
    font-family: Arial, sans-serif;
    background: #fff;
    margin: 0;
    padding: 20px;
}

/* TITLE */
h1 {
    text-align: center;
    margin-bottom: 30px;
}

/* TOP CARDS */
.cards {
    display: flex;
    gap: 20px;
    margin-bottom: 20px;
}

.card {
    flex: 1;
    border: 2px solid #000;
    padding: 15px;
    text-align: center;
}

.card i {
    font-size: 30px;
}

.card h2 {
    margin: 10px 0;
}

/* GRID */
.grid {
    display: grid;
    grid-template-columns: 2fr 1fr;
    gap: 20px;
}

/* BOX */
.box {
    border: 2px solid #000;
    padding: 15px;
}

/* ROW */
.row {
    display: grid;
    grid-template-columns: 1fr 2fr;
    gap: 20px;
    margin-top: 20px;
}

/* CHART SIZE */
canvas {
    width: 100% !important;
    height: 250px !important;
}

/* SMALL */
.small canvas {
    height: 200px !important;
}
</style>
</head>

<body>

<h1>Dashboard</h1>

<!-- TOP CARDS -->
<div class="cards">
    <div class="card">
        <i>🛒</i>
        <h2>123</h2>
        <p>Total Orders</p>
    </div>

    <div class="card">
        <i>📦</i>
        <h2>67</h2>
        <p>Total Delivered</p>
    </div>

    <div class="card">
        <i>❌</i>
        <h2>26</h2>
        <p>Total Cancelled</p>
    </div>

    <div class="card">
        <i>📊</i>
        <h2>₱1K</h2>
        <p>Total Revenue</p>
    </div>
</div>

<!-- PIE + BAR -->
<div class="grid">

    <!-- PIE -->
    <div class="box">
        <h2>Pie Chart</h2>
        <canvas id="pieChart"></canvas>
    </div>

    <!-- BAR -->
    <div class="box">
        <h2>Customer Map</h2>
        <canvas id="barChart"></canvas>
    </div>

</div>

<!-- LOWER -->
<div class="row">

    <!-- POPULAR -->
    <div class="box small">
        <h2>Popular Products</h2>
        <canvas id="productChart"></canvas>
    </div>

    <!-- LINE -->
    <div class="box">
        <h2>Total Revenue</h2>
        <canvas id="lineChart"></canvas>
    </div>

</div>

<!-- USERS -->
<div class="box" style="margin-top:20px;">
    <h2>Active Users</h2>
    <canvas id="gaugeChart"></canvas>
</div>

<script>
// PIE
new Chart(document.getElementById("pieChart"), {
    type: "doughnut",
    data: {
        labels: ["Orders", "Growth", "Revenue"],
        datasets: [{
            data: [81, 22, 62],
            backgroundColor: ["red", "green", "blue"]
        }]
    }
});

// BAR
new Chart(document.getElementById("barChart"), {
    type: "bar",
    data: {
        labels: ["Manila", "Valenzuela", "Bulacan", "Cebu"],
        datasets: [{
            data: [60, 45, 80, 30],
            backgroundColor: ["blue", "purple", "orange", "gold"]
        }]
    }
});

// POPULAR PRODUCTS
new Chart(document.getElementById("productChart"), {
    type: "pie",
    data: {
        labels: ["Sales", "Finance", "Marketing", "HR"],
        datasets: [{
            data: [55, 25, 15, 5],
            backgroundColor: ["blue", "purple", "orange", "yellow"]
        }]
    }
});

// LINE
new Chart(document.getElementById("lineChart"), {
    type: "line",
    data: {
        labels: ["2021","2022","2023","2024","2025"],
        datasets: [
            {
                label: "Mobile",
                data: [12,14,15,18,24],
                borderColor: "blue"
            },
            {
                label: "Desktop",
                data: [10,12,16,17,20],
                borderColor: "purple"
            },
            {
                label: "Tablet",
                data: [8,9,13,15,16],
                borderColor: "orange"
            }
        ]
    }
});

// GAUGE (fake using doughnut)
new Chart(document.getElementById("gaugeChart"), {
    type: "doughnut",
    data: {
        datasets: [{
            data: [70, 30],
            backgroundColor: ["blue", "#eee"]
        }]
    },
    options: {
        circumference: 180,
        rotation: 270
    }
});
</script>

</body>
</html>
