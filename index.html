<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Super Admin Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
    font-family: Arial, sans-serif;
    background: #fff;
    margin: 0;
    padding: 20px;
}

h1 {
    text-align: center;
    margin-bottom: 30px;
}

/* CARDS */
.cards {
    display: flex;
    gap: 20px;
    margin-bottom: 20px;
}

.card {
    flex: 1;
    border: 2px solid #000;
    padding: 15px;
    text-align: center;
}

/* GRID */
.grid {
    display: grid;
    grid-template-columns: 2fr 1fr;
    gap: 20px;
}

/* BOX */
.box {
    border: 2px solid #000;
    padding: 15px;
}

/* PIE CONTAINER */
.pie-container {
    display: flex;
    justify-content: space-around;
    margin-top: 20px;
}

.pie-item {
    text-align: center;
}

canvas {
    width: 120px !important;
    height: 120px !important;
}
</style>
</head>

<body>

<h1>Dashboard</h1>

<!-- TOP CARDS -->
<div class="cards">
    <div class="card"><h2>123</h2><p>Total Orders</p></div>
    <div class="card"><h2>67</h2><p>Total Delivered</p></div>
    <div class="card"><h2>26</h2><p>Total Cancelled</p></div>
    <div class="card"><h2>₱1K</h2><p>Total Revenue</p></div>
</div>

<!-- PIE + BAR -->
<div class="grid">

    <!-- PIE -->
    <div class="box">
        <h2>Pie Chart</h2>

        <div class="pie-container">

            <div class="pie-item">
                <canvas id="pie1"></canvas>
                <p>Total Order</p>
            </div>

            <div class="pie-item">
                <canvas id="pie2"></canvas>
                <p>Customer Growth</p>
            </div>

            <div class="pie-item">
                <canvas id="pie3"></canvas>
                <p>Total Revenue</p>
            </div>

        </div>
    </div>

    <!-- BAR -->
    <div class="box">
        <h2>Customer Map</h2>
        <canvas id="barChart"></canvas>
    </div>

</div>

<script>
// PIE 1
new Chart(document.getElementById("pie1"), {
    type: "doughnut",
    data: {
        datasets: [{
            data: [81, 19],
            backgroundColor: ["#ef4444", "#eee"],
            borderWidth: 0
        }]
    },
    options: {
        cutout: "70%",
        plugins: { legend: { display: false } }
    }
});

// PIE 2
new Chart(document.getElementById("pie2"), {
    type: "doughnut",
    data: {
        datasets: [{
            data: [22, 78],
            backgroundColor: ["#10b981", "#eee"],
            borderWidth: 0
        }]
    },
    options: {
        cutout: "70%",
        plugins: { legend: { display: false } }
    }
});

// PIE 3
new Chart(document.getElementById("pie3"), {
    type: "doughnut",
    data: {
        datasets: [{
            data: [62, 38],
            backgroundColor: ["#3b82f6", "#eee"],
            borderWidth: 0
        }]
    },
    options: {
        cutout: "70%",
        plugins: { legend: { display: false } }
    }
});

// BAR CHART (Improved)
new Chart(document.getElementById("barChart"), {
    type: "bar",
    data: {
        labels: ["Manila", "Valenzuela", "Bulacan", "Cebu"],
        datasets: [{
            data: [60, 45, 80, 30],
            backgroundColor: ["#3b82f6", "#8b5cf6", "#f59e0b", "#facc15"],
            borderRadius: 10
        }]
    },
    options: {
        plugins: { legend: { display: false } },
        scales: {
            y: { beginAtZero: true }
        }
    }
});
</script>

</body>
</html>
