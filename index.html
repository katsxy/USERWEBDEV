<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>User Feedback</title>

<style>
body {
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #667eea, #764ba2, #ff758c);
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    margin: 0;
}

/* MAIN BOX */
.feedback-container {
    backdrop-filter: blur(15px);
    background: rgba(255, 255, 255, 0.15);
    padding: 30px;
    border-radius: 20px;
    width: 360px;
    text-align: center;
    border: 2px solid rgba(255,255,255,0.3);
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    color: white;
}

/* TITLE */
h2 {
    margin-bottom: 15px;
    font-weight: bold;
}

/* STAR RATING */
.rating {
    margin: 20px 0;
}

.star {
    font-size: 32px;
    cursor: pointer;
    color: #ccc;
    transition: transform 0.2s, color 0.3s;
}

.star:hover {
    transform: scale(1.2);
}

.star.active {
    color: gold;
}

/* TEXTAREA FIX (CENTERED) */
.textarea-container {
    display: flex;
    justify-content: center;
}

textarea {
    width: 90%;
    height: 90px;
    border-radius: 12px;
    border: none;
    padding: 12px;
    outline: none;
    resize: none;
    font-size: 14px;
}

/* BUTTON */
button {
    margin-top: 18px;
    padding: 12px 25px;
    border: none;
    border-radius: 25px;
    background: linear-gradient(45deg, #ff758c, #ff7eb3);
    color: white;
    font-size: 15px;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    transform: scale(1.05);
    box-shadow: 0 5px 15px rgba(0,0,0,0.3);
}

/* POPUP */
.popup {
    display: none;
    position: fixed;
    top: 20px;
    background: #00c853;
    color: white;
    padding: 12px 25px;
    border-radius: 20px;
    font-weight: bold;
    box-shadow: 0 5px 15px rgba(0,0,0,0.3);
}
</style>
</head>

<body>

<div class="feedback-container">
    <h2>Leave’s a Feedback</h2>

    <div class="rating">
        <span class="star" onclick="rate(1)">★</span>
        <span class="star" onclick="rate(2)">★</span>
        <span class="star" onclick="rate(3)">★</span>
        <span class="star" onclick="rate(4)">★</span>
        <span class="star" onclick="rate(5)">★</span>
    </div>

    <div class="textarea-container">
        <textarea placeholder="Write your feedback here..."></textarea>
    </div>

    <button onclick="submitFeedback()">Submit</button>
</div>

<div class="popup" id="popup">Thank you for your feedback!</div>

<script>
let selectedRating = 0;

function rate(rating) {
    selectedRating = rating;
    let stars = document.querySelectorAll('.star');

    stars.forEach((star, index) => {
        if (index < rating) {
            star.classList.add('active');
        } else {
            star.classList.remove('active');
        }
    });
}

function submitFeedback() {
    let popup = document.getElementById("popup");

    popup.style.display = "block";

    setTimeout(() => {
        popup.style.display = "none";
    }, 2000);
}
</script>

</body>
</html>
