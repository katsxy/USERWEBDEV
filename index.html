<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Super Admin Profile</title>

<style>
body {
    font-family: 'Segoe UI', sans-serif;
    background: #f4f6f9;
    margin: 0;
    padding: 30px;
}

/* TITLE */
h1 {
    margin-bottom: 20px;
}

/* CARD */
.card {
    background: white;
    border-radius: 15px;
    padding: 25px;
    margin-bottom: 25px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    border-left: 6px solid #8e44ad; /* super admin color */
}

/* HEADER */
.card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
}

.card-header h2 {
    margin: 0;
}

/* BUTTON */
.edit-btn, .save-btn, .logout-btn {
    padding: 8px 18px;
    border-radius: 20px;
    border: 2px solid #8e44ad;
    background: transparent;
    cursor: pointer;
    transition: 0.3s;
}

.edit-btn:hover, .save-btn:hover, .logout-btn:hover {
    background: #8e44ad;
    color: white;
    transform: scale(1.05);
}

/* PROFILE */
.profile {
    display: flex;
    align-items: center;
    gap: 20px;
}

.avatar {
    width: 70px;
    height: 70px;
    border-radius: 50%;
    border: 3px solid #8e44ad;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 30px;
    color: #8e44ad;
}

/* GRID */
.info-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
}

.info {
    display: flex;
    flex-direction: column;
}

.label {
    font-size: 13px;
    color: gray;
}

.value {
    font-weight: bold;
    margin-top: 5px;
}

/* INPUTS */
.input-box {
    width: 300px;
    padding: 10px 15px;
    border-radius: 25px;
    border: 2px solid #ccc;
    outline: none;
    margin-bottom: 10px;
    transition: 0.3s;
}

.input-box:focus {
    border-color: #8e44ad;
}

/* FOOTER BUTTONS */
.bottom-actions {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

/* RESPONSIVE */
@media (max-width: 600px) {
    .info-grid {
        grid-template-columns: 1fr;
    }

    .input-box {
        width: 100%;
    }

    .bottom-actions {
        flex-direction: column;
        gap: 10px;
    }
}
</style>
</head>

<body>

<h1>Super Admin Profile</h1>

<!-- PROFILE -->
<div class="card">
    <div class="card-header">
        <h2>My Profile</h2>
        <button class="edit-btn">Edit</button>
    </div>

    <div class="profile">
        <div class="avatar">👤</div>
        <div>
            <div class="value">Super Admin Name</div>
            <div class="label">Super Admin</div>
        </div>
    </div>
</div>

<!-- PERSONAL INFO -->
<div class="card">
    <div class="card-header">
        <h2>Personal Information</h2>
        <button class="edit-btn">Edit</button>
    </div>

    <div class="info-grid">
        <div class="info">
            <span class="label">First Name</span>
            <span class="value">Dora</span>
        </div>

        <div class="info">
            <span class="label">Last Name</span>
            <span class="value">Explorer</span>
        </div>

        <div class="info">
            <span class="label">Email Address</span>
            <span class="value">123dinoror@gmail.com</span>
        </div>

        <div class="info">
            <span class="label">Phone Number</span>
            <span class="value">+63 123456789</span>
        </div>

        <div class="info">
            <span class="label">Role</span>
            <span class="value">Super Admin</span>
        </div>
    </div>
</div>

<!-- CHANGE PASSWORD -->
<div class="card">
    <div class="card-header">
        <h2>Change Password</h2>
    </div>

    <input type="password" class="input-box" placeholder="Current Password"><br>
    <input type="password" class="input-box" placeholder="New Password"><br>
    <input type="password" class="input-box" placeholder="Confirm Password"><br>

    <div style="text-align: right;">
        <button class="save-btn">Save Changes</button>
    </div>
</div>

<!-- LOGOUT -->
<div style="text-align: right;">
    <button class="logout-btn">Log-out</button>
</div>

</body>
</html>
