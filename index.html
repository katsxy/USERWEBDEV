<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Profile</title>

<style>
body {
    font-family: 'Segoe UI', sans-serif;
    background: #f4f6f9;
    margin: 0;
    padding: 30px;
}

/* TITLE */
h1 {
    margin-bottom: 20px;
}

/* CARD */
.card {
    background: white;
    border-radius: 15px;
    padding: 25px;
    margin-bottom: 25px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    border-left: 6px solid #ff6b6b; /* admin color */
}

/* HEADER */
.card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
}

.card-header h2 {
    margin: 0;
}

/* EDIT BUTTON */
.edit-btn {
    padding: 6px 15px;
    border-radius: 20px;
    border: 2px solid #ff6b6b;
    background: transparent;
    cursor: pointer;
    transition: 0.3s;
}

.edit-btn:hover {
    background: #ff6b6b;
    color: white;
}

/* PROFILE */
.profile {
    display: flex;
    align-items: center;
    gap: 20px;
}

.avatar {
    width: 70px;
    height: 70px;
    border-radius: 50%;
    border: 3px solid #ff6b6b;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 30px;
    color: #ff6b6b;
}

/* GRID */
.info-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
}

.info {
    display: flex;
    flex-direction: column;
}

.label {
    font-size: 13px;
    color: gray;
}

.value {
    font-weight: bold;
    margin-top: 5px;
}

/* LOGOUT BUTTON */
.logout-btn {
    margin-top: 25px;
    padding: 12px 30px;
    border-radius: 25px;
    border: 2px solid #ff6b6b;
    background: transparent;
    font-size: 16px;
    cursor: pointer;
    transition: 0.3s;
}

.logout-btn:hover {
    background: #ff6b6b;
    color: white;
    transform: scale(1.05);
}

/* RESPONSIVE */
@media (max-width: 600px) {
    .info-grid {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<h1>Admin Profile</h1>

<!-- PROFILE -->
<div class="card">
    <div class="card-header">
        <h2>My Profile</h2>
        <button class="edit-btn">Edit</button>
    </div>

    <div class="profile">
        <div class="avatar">👤</div>
        <div>
            <div class="value">Admin Name</div>
            <div class="label">Role / Staff 1</div>
        </div>
    </div>
</div>

<!-- PERSONAL INFO -->
<div class="card">
    <div class="card-header">
        <h2>Personal Information</h2>
        <button class="edit-btn">Edit</button>
    </div>

    <div class="info-grid">
        <div class="info">
            <span class="label">First Name</span>
            <span class="value">Dora</span>
        </div>

        <div class="info">
            <span class="label">Last Name</span>
            <span class="value">Explorer</span>
        </div>

        <div class="info">
            <span class="label">Email Address</span>
            <span class="value">123dinoror@gmail.com</span>
        </div>

        <div class="info">
            <span class="label">Phone Number</span>
            <span class="value">+63 123456789</span>
        </div>

        <div class="info">
            <span class="label">Role / Staff</span>
            <span class="value">Admin #1</span>
        </div>
    </div>

    <button class="logout-btn">Log-out</button>
</div>

</body>
</html>
