<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Settings</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
:root {
    --primary: #4f46e5;
    --bg: #f4f6fb;
    --card: #ffffff;
    --border: #e5e7eb;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: var(--bg);
}

/* HEADER */
.header {
    padding: 20px;
    text-align: center;
}

/* TOP BAR */
.top-bar {
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    padding: 0 20px;
    gap: 10px;
}

.search input {
    padding: 8px;
    border-radius: 8px;
    border: 1px solid var(--border);
}

/* BUTTON */
.btn {
    border: none;
    padding: 8px 15px;
    border-radius: 8px;
    background: var(--primary);
    color: white;
    cursor: pointer;
    transition: 0.3s;
}

.btn:hover {
    opacity: 0.85;
}

/* GRID */
.products {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 20px;
    padding: 20px;
}

/* CARD */
.card {
    background: white;
    border-radius: 12px;
    padding: 15px;
    border: 1px solid var(--border);
    transition: 0.3s;
    position: relative;
}

.card:hover {
    transform: translateY(-5px);
}

.card img {
    width: 100%;
    height: 130px;
    object-fit: cover;
    border-radius: 10px;
}

/* STATUS BADGE */
.status {
    position: absolute;
    top: 10px;
    right: 10px;
    padding: 5px 10px;
    border-radius: 20px;
    font-size: 12px;
    color: white;
}

.available { background: #10b981; }
.soldout { background: #ef4444; }

/* TEXT */
.card h3 {
    margin: 10px 0 5px;
}

.card p {
    margin: 0;
    color: gray;
}

/* ACTIONS */
.actions {
    margin-top: 10px;
    display: flex;
    justify-content: space-between;
    gap: 5px;
}

.small-btn {
    flex: 1;
    padding: 6px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
}

.toggle { background: #f59e0b; color: white; }
.delete { background: #ef4444; color: white; }

/* MODAL */
.modal {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.4);
    justify-content: center;
    align-items: center;
}

.modal-content {
    background: white;
    padding: 20px;
    border-radius: 12px;
    width: 300px;
}

.modal-content input {
    width: 100%;
    margin-bottom: 10px;
    padding: 8px;
}
</style>
</head>

<body>

<div class="header">
    <h1>Product Settings</h1>
</div>

<div class="top-bar">
    <div class="search">
        <input type="text" placeholder="Search product..." onkeyup="searchProduct(this.value)">
    </div>
    <button class="btn" onclick="openModal()">+ Add Product</button>
</div>

<!-- PRODUCT GRID -->
<div class="products" id="productList">

    <div class="card" data-name="burger">
        <span class="status available">Available</span>
        <img src="https://via.placeholder.com/200">
        <h3>Burger</h3>
        <p>₱50</p>
        <div class="actions">
            <button class="small-btn toggle" onclick="toggleStatus(this)">Toggle</button>
            <button class="small-btn delete" onclick="deleteProduct(this)">Delete</button>
        </div>
    </div>

    <div class="card" data-name="fries">
        <span class="status soldout">Sold Out</span>
        <img src="https://via.placeholder.com/200">
        <h3>Fries</h3>
        <p>₱30</p>
        <div class="actions">
            <button class="small-btn toggle" onclick="toggleStatus(this)">Toggle</button>
            <button class="small-btn delete" onclick="deleteProduct(this)">Delete</button>
        </div>
    </div>

</div>

<!-- MODAL -->
<div class="modal" id="modal">
    <div class="modal-content">
        <h3>Add Product</h3>
        <input type="text" id="name" placeholder="Product Name">
        <input type="number" id="price" placeholder="Price">
        <input type="text" id="img" placeholder="Image URL">
        <button class="btn" onclick="addProduct()">Add</button>
    </div>
</div>

<script>
function toggleStatus(btn) {
    let card = btn.closest(".card");
    let badge = card.querySelector(".status");

    if (badge.classList.contains("available")) {
        badge.classList.remove("available");
        badge.classList.add("soldout");
        badge.textContent = "Sold Out";
    } else {
        badge.classList.remove("soldout");
        badge.classList.add("available");
        badge.textContent = "Available";
    }
}

function deleteProduct(btn) {
    btn.closest(".card").remove();
}

function openModal() {
    document.getElementById("modal").style.display = "flex";
}

function addProduct() {
    let name = document.getElementById("name").value;
    let price = document.getElementById("price").value;
    let img = document.getElementById("img").value || "https://via.placeholder.com/200";

    let div = document.createElement("div");
    div.className = "card";
    div.setAttribute("data-name", name.toLowerCase());

    div.innerHTML = `
        <span class="status available">Available</span>
        <img src="${img}">
        <h3>${name}</h3>
        <p>₱${price}</p>
        <div class="actions">
            <button class="small-btn toggle" onclick="toggleStatus(this)">Toggle</button>
            <button class="small-btn delete" onclick="deleteProduct(this)">Delete</button>
        </div>
    `;

    document.getElementById("productList").appendChild(div);
    document.getElementById("modal").style.display = "none";
}

function searchProduct(value) {
    let cards = document.querySelectorAll(".card");

    cards.forEach(card => {
        let name = card.dataset.name;
        card.style.display = name.includes(value.toLowerCase()) ? "" : "none";
    });
}
</script>

</body>
</html>
